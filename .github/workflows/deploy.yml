name: Build and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to deploy; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, but let a running one finish so the site is never
# left half-published mid-propagation.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # One switch keeps asset paths and indexing policy in sync during cutover.
    # Unset means staging. Production is selected explicitly in repo variables.
    env:
      PUBLIC_INDEXABLE: ${{ vars.LUMA_DEPLOYMENT == 'production' && 'true' || 'false' }}
      PUBLIC_BASE: ${{ vars.LUMA_DEPLOYMENT == 'production' && '/' || '/lumw' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap dates each URL from the last commit that touched its
          # sources. A shallow checkout only knows the newest commit, so every
          # page would claim to have changed today - which is the untrustworthy
          # lastmod this replaced.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and verify the complete deployment artifact
        run: npm run verify

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Verify real visitor journeys and accessibility
        run: npm run check:browser

      - name: Enforce mobile performance budgets
        run: npm run check:performance
        env:
          LUMA_LIGHTHOUSE_RUNS: '3'

      - name: Keep browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-verification
          path: artifacts/
          retention-days: 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
